name: New look-alike domains (smoke test)
on:
  workflow_dispatch:
  push:
    branches: [feature/link-intel]
    paths: [lib/nrd.js, scripts/nrd-check.mjs, .github/workflows/nrd-smoke.yml]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts
      - run: node --import ./scripts/resolve-hook.mjs scripts/nrd-check.mjs
